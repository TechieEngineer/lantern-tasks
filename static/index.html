:inset 0 -2px var(--pink)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.focus-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.focus-slot{min-height:70px;border:1px dashed var(--line);border-radius:9px;padding:10px;color:var(--muted);overflow-wrap:anywhere}.focus-slot.filled{border-style:solid;border-color:var(--olive);color:var(--text);background:var(--surface);display:flex;align-items:flex-start;gap:8px}.focus-slot span{flex:1}.focus-slot button{padding:1px 6px;border:none;background:transparent;color:var(--muted)}.filters{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}.filters input{flex:1;min-width:120px}.filters select{max-width:180px}.task{display:flex;gap:12px;padding:14px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--sage);border-radius:11px;margin-bottom:8px;align-items:flex-start}.task[data-priority=High]{border-left-color:var(--pink)}.task[data-priority=Medium]{border-left-color:#b49b64}.task[data-priority=Low]{border-left-color:var(--sage)}.task-body{flex:1;min-width:0}.task-title{font-size:16px;font-weight:650;overflow-wrap:anywhere}.done .task-title{text-decoration:line-through;color:var(--muted)}.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.chip{font-size:11px;border:1px solid var(--line);border-radius:5px;padding:2px 6px;color:var(--muted);overflow-wrap:anywhere;max-width:100%}.chip.high,.overdue{color:var(--pink)}.chip.low{color:var(--sage)}.chip.focus{color:var(--sage);border-color:var(--olive)}.actions{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}.actions button{padding:5px 8px;font-size:12px;background:transparent}.actions button.starred{color:var(--pink);border-color:var(--pink)}.sub{display:flex;gap:8px;align-items:center;margin-top:7px;font-size:13px;overflow-wrap:anywhere}.sub input{width: <body><main class="wrap">
<header class="top flex items-center justify-between"><div class="brand"><div class="mark" aria-hidden="true">L</div><div><h1>Lantern Tasks</h1><p class="status" id="status" role="status">Loading local cache…</p></div></div><div class="flex gap-2"><button id="sync" title="Sync now">Sync</button><button id="theme" aria-label="Toggle light and dark mode">Light</button></div></header>
<section class="hero"><div class="muted" id="date"></div><h2>Make today count.</h2><p class="muted">One task at a time. Your data stays on your LAN server.</p></section>
<form id="capture" class="capture"><input id="quick" maxlength="500" placeholder="Quick capture — what needs doing?" aria-label="New task title" required autocomplete="off"><button class="primary" type="submit">+ Add</button><button type="button" id="details">Details</button></form>
<p id="notice" class="error" role="alert" hidden></p>
<nav class="nav" id="nav" aria-label="Task views"><button data-tab="today" class="active">Today</button><button data-tab="all">All tasks</button><button data-tab="upcoming">Upcoming</button><button data-tab="completed">Completed</button></nav>
<section class="panel" id="focus-panel"><div class="panel-head"><div><h2>Top 3 Daily Focus</h2><small>Star the tasks that matter most today.</small></div><span id="focus-count" class="count"></span></div><div class="focus-grid" id="focus-grid"></div><div class="progress" role="presentation"><span id="focus-progress"></span></div></section>
<section><div class="panel-head"><h2 id="view-title">Today</h2><span id="count" class="count"></span></div><div class="filters"><input id="search" placeholder="Search tasks…" aria-label="Search tasks"><select id="priority-filter" aria-label="Filter priority"><option value="">All priorities</option><option>High</option><option>Medium</option><option>Low</option></select><select id="category-filter" aria-label="Filter category"><option value="">All categories</option></select></div><div id="tasks"></div></section>
<small>Local-first · No accounts · Trusted Wi-Fi only. <a href="?lite=1">Lite mode</a> skips the optional CDN stylesheet.</small>
</main>
<div id="overlay" class="overlay" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="editor-title"><div class="panel-head"><h2 id="editor-title">Task details</h2><button id="close-editor" aria-label="Close editor">✕</button></div><form id="editor"><div class="fields">
<label class="full">Title<input name="title" required maxlength="500"></label><label>Priority<select name="priority"><option>High</option><option>Medium</option><option>Low</option></select></label><label>Estimate (minutes)<input name="estimate" type="number" min="0" max="10080" value="0"></label><label>Planned day<input name="planned_date" type="date"></label><label>Due date (deadline)<input name="due_date" type="date"></label><label>Category<input name="category" maxlength="200" placeholder="Study, work, personal"></label><label>Tags (comma separated)<input name="tags" placeholder="physics, revision"></label><label>Repeat<select name="recurrence"><option value="none">Never</option><option value="daily">Daily</option><option value="weekly">Weekly</option><option value="monthly">Monthly</option></select></label><label class="check-label"><input name="rollover" type="checkbox"> Roll unfinished planned day forward</label><label class="full">Notes<textarea name="notes" rows="3" maxlength="20000"></textarea></label><label class="full">Links (one http/https URL per line)<textarea name="links" rows="2"></textarea></label><div class="full"><div class="panel-head"><span class="muted">Subtasks</span><button type="button" id="add-sub">+ Subtask</button></div><div id="sub-edit"></div></div>
</div><div class="footer"><button type="button" id="delete" class="danger" hidden>Delete task</button><div class="flex gap-2"><button type="button" id="cancel">Cancel</button><button class="primary" type="submit">Save task</button></div></div></form></section></div>
<script>
(function(){'use strict';
const $=id=>document.getElementById(id), store={get:(s,k,f)=>{try{const v=s.getItem(k);return v===null?f:JSON.parse(v)}catch(e){return f}},set:(s,k,v)=>{try{s.setItem(k,JSON.stringify(v))}catch(e){}}};
const localDay=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const initial={today:localDay(),tasks:[]};let base=store.get(localStorage,'lantern.cache.v1',initial), pending=store.get(sessionStorage,'lantern.queue.v1',[]), view='today', editing=null, editOriginal=null, busy=false, again=false, retryAt=0, failures=0, lastDraw='', previousFocus=null;
if(!base||!Array.isArray(base.tasks))base=initial;if(!Array.isArray(pending))pending=[];
const id=()=>{const a=new Uint8Array(16);if(window.crypto&&crypto.getRandomValues){crypto.getRandomValues(a);return Array.from(a,x=>x.toString(16).padStart(2,'0')).join('')}return Date.now().toString(36)+Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2)};
const defaults=(taskId,day)=>({id:taskId,title:'',priority:'Medium',planned_date:day,due_date:'',estimate:0,category:'',tags:[],notes:'',links:[],subtasks:[],recurrence:'none',rollover:true,completed:false,focus_date:'',next_occurrence:'',created_at:new Date().toISOString(),updated_at:''});
function snapshot(){const tasks=base.tasks.map(t=>Object.assign({},t));for(const op of pending){let i=tasks.findIndex(t=>t.id===op.id);if(op.method==='DELETE'){if(i>=0)tasks.splice(i,1);continue}if(i<0&&op.method==='POST'){tasks.push(defaults(op.id,base.today));i=tasks.length-1}if(i<0)continue;const p=Object.assign({},op.body);if(Object.prototype.hasOwnProperty.call(p,'focus')){p.focus_date=p.focus?base.today:'';delete p.focus}tasks[i]=Object.assign({},tasks[i],p)}return {today:base.today,tasks}}
function saveQueue(){store.set(sessionStorage,'lantern.queue.v1',pending)}
function status(text,state){$('status').textContent=text;$('status').dataset.state=state||''}
function notice(text){$('notice').textContent=text;$('notice').hidden=!text}
function enqueue(method,taskId,body){notice('');pending.push({method,id:taskId,body});saveQueue();draw(true);status('Syncing · '+pending.length+' pending','');sync(true)}
async function request(path,method,body){const ctrl=typeof AbortController==='function'?new AbortController():null;const timer=ctrl?setTimeout(()=>ctrl.abort(),8000):null;try{const opts={method,cache:'no-store',headers:{'Content-Type':'application/json'}};if(ctrl)opts.signal=ctrl.signal;if(body&&method!=='DELETE')opts.body=JSON.stringify(body);const r=await fetch(path,opts);let data;try{data=await r.json()}catch(e){throw new Error('Invalid server response')}if(!r.ok){const e=new Error(data.error||'Request failed');e.code=r.status;throw e}if(!data||!Array.isArray(data.tasks)||typeof data.today!=='string')throw new Error('Invalid state');return data}finally{if(timer)clearTimeout(timer)}}
function accept(s){base=s;store.set(localStorage,'lantern.cache.v1',base)}
async function sync(force){if(busy){if(force)again=true;return}if(!force&&Date.now()<retryAt)return;busy=true;again=false;try{while(pending.length){const op=pending[0];try{const path=op.method==='POST'?'/api/tasks':'/api/tasks/'+encodeURIComponent(op.id);accept(await request(path,op.method,op.body));pending.shift();saveQueue();draw()}catch(e){if(e.code>=400&&e.code<500){pending.shift();saveQueue();notice(e.message+' The rejected edit was undone.');draw(true);continue}throw e}}accept(await request('/api/state','GET'));failures=0;retryAt=0;status('Synced · '+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}),'ok');draw()}catch(e){failures++;retryAt=Date.now()+Math.min(30000,1000*Math.pow(2,Math.min(failures,5)));status((pending.length?'Offline · '+pending.length+' pending':'Offline · showing cache'),'error')}finally{busy=false;if(again||(!failures&&pending.length))sync(true)}}
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}
function btn(text,action,taskId,cls){const b=el('button',cls,text);b.type='button';b.dataset.action=action;b.dataset.id=taskId;return b}
function checkbox(checked,action,taskId,description){const c=el('input');c.type='checkbox';c.checked=!!checked;c.dataset.action=action;c.dataset.id=taskId;c.setAttribute('aria-label',description);return c}
function chip(parent,text,cls){if(text)parent.appendChild(el('span','chip '+(cls||''),text))}
function isToday(t,day){return !t.completed&&(t.planned_date===day||(t.due_date&&t.due_date<=day)||t.focus_date===day||!t.planned_date||(t.planned_date<day))}
function draw(force){const s=snapshot(),day=s.today,all=s.tasks;const query=$('search').value.trim().toLowerCase(),priority=$('priority-filter').value,category=$('category-filter').value;const key=JSON.stringify([s,view,query,priority,category]);if(!force&&key===lastDraw)return;lastDraw=key;
$('date').textContent=new Date(day+'T12:00:00').toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'});const focused=all.filter(t=>t.focus_date===day);$('focus-count').textContent=focused.length+'/3 selected';$('focus-progress').style.width=(focused.filter(t=>t.completed).length/3*100)+'%';$('focus-panel').hidden=view!=='today';const fg=$('focus-grid');fg.textContent='';for(let i=0;i<3;i++){const t=focused[i],slot=el('div','focus-slot'+(t?' filled':''));if(t){slot.append(checkbox(t.completed,'complete',t.id,'Complete '+t.title),el('span','',t.title),btn('×','focus',t.id));}else slot.textContent=(i+1)+'. Choose a task';fg.appendChild(slot)}
const cats=Array.from(new Set(all.map(t=>t.category).filter(Boolean))).sort();const cf=$('category-filter');cf.textContent='';const opt=el('option','','All categories');opt.value='';cf.appendChild(opt);cats.forEach(c=>{const o=el('option','',c);o.value=c;cf.appendChild(o)});cf.value=cats.includes(category)?category:'';
const titles={today:'Today',all:'All tasks',upcoming:'Upcoming',completed:'Completed'};$('view-title').textContent=titles[view];document.querySelectorAll('#nav button').forEach(b=>{b.classList.toggle('active',b.dataset.tab===view);b.setAttribute('aria-pressed',String(b.dataset.tab===view))});
const order={High:0,Medium:1,Low:2};let tasks=all.filter(t=>{if(view==='today'&&!isToday(t,day))return false;if(view==='upcoming'&&(t.completed||!((t.planned_date&&t.planned_date>day)||(t.due_date&&t.due_date>day))))return false;if(view==='completed'&&!t.completed)return false;if(priority&&t.priority!==priority)return false;if(cf.value&&t.category!==cf.value)return false;return !query||[t.title,t.category,t.notes].concat(t.tags||[],t.links||[],(t.subtasks||[]).map(x=>x.text)).join(' ').toLowerCase().includes(query)});tasks.sort((a,b)=>Number(a.completed)-Number(b.completed)||Number(b.focus_date===day)-Number(a.focus_date===day)||(order[a.priority]-order[b.priority])||((a.due_date||'9999').localeCompare(b.due_date||'9999'))||a.created_at.localeCompare(b.created_at));$('count').textContent=tasks.length+' task'+(tasks.length===1?'':'s');const root=$('tasks');root.textContent='';if(!tasks.length){root.appendChild(el('div','empty',query?'No matching tasks.':view==='today'?'Nothing planned for today. Capture a task above.':'No tasks in this view.'));return}const frag=document.createDocumentFragment();for(const t of tasks){const card=el('article','task'+(t.completed?' done':''));card.dataset.priority=t.priority;card.appendChild(checkbox(t.completed,'complete',t.id,'Complete '+t.title));const content=el('div','task-body');content.appendChild(el('h3','task-title',t.title));const m=el('div','meta');chip(m,t.priority,t.priority.toLowerCase());if(t.planned_date)chip(m,'Plan '+t.planned_date);if(t.due_date)chip(m,'Due '+t.due_date,!t.completed&&t.due_date<day?'overdue':'');if(t.estimate)chip(m,t.estimate+' min');chip(m,t.category);(t.tags||[]).forEach(x=>chip(m,'#'+x));if(t.recurrence!=='none')chip(m,'↻ '+t.recurrence);if(t.next_occurrence)chip(m,'Next '+t.next_occurrence);if(t.focus_date===day)chip(m,'Focus','focus');content.appendChild(m);(t.subtasks||[]).forEach((sub,i)=>{const l=el('label','sub');const c=checkbox(sub.done,'subtask',t.id,'Complete subtask '+sub.text);c.dataset.index=i;l.append(c,el('span','',sub.text));content.appendChild(l)});if(t.notes)content.appendChild(el('p','note',t.notes));(t.links||[]).forEach(link=>{try{const u=new URL(link);if(u.protocol!=='http:'&&u.protocol!=='https:')return;const a=el('a','note',link);a.href=u.href;a.target='_blank';a.rel='noopener noreferrer';const p=el('p');p.appendChild(a);content.appendChild(p)}catch(e){}});card.appendChild(content);const act=el('div','actions');const star=btn(t.focus_date===day?'★ Focus':'☆ Focus','focus',t.id,t.focus_date===day?'starred':'');star.setAttribute('aria-pressed',String(t.focus_date===day));act.append(star,btn('Edit','edit',t.id));card.appendChild(act);frag.appendChild(card)}root.appendChild(frag)}
function getTask(id){return snapshot().tasks.find(t=>t.id===id)}
function handle(e){const b=e.target.closest('[data-action]');if(!b)return;const t=getTask(b.dataset.id);if(!t)return;const a=b.dataset.action;if(e.type==='change'&&a==='complete')enqueue('PATCH',t.id,{completed:b.checked});if(e.type==='change'&&a==='subtask'){const subs=t.subtasks.map((s,i)=>i===Number(b.dataset.index)?Object.assign({},s,{done:b.checked}):s);enqueue('PATCH',t.id,{subtasks:subs})}if(e.type==='click'&&a==='focus'){const s=snapshot(),on=t.focus_date===s.today;if(!on&&s.tasks.filter(x=>x.focus_date===s.today).length>=3){notice('Choose at most three focus tasks. Remove one first.');return}enqueue('PATCH',t.id,{focus:!on})}if(e.type==='click'&&a==='edit')openEditor(t)}
for(const name of ['tasks','focus-grid']){ $(name).addEventListener('click',handle);$(name).addEventListener('change',handle)}
$('nav').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b){view=b.dataset.tab;draw(true)}});$('search').addEventListener('input',()=>draw(true));$('priority-filter').addEventListener('change',()=>draw(true));$('category-filter').addEventListener('change',()=>draw(true));
$('quick').value=store.get(sessionStorage,'lantern.draft','');$('quick').addEventListener('input',()=>store.set(sessionStorage,'lantern.draft',$('quick').value));$('capture').addEventListener('submit',e=>{e.preventDefault();const title=$('quick').value.trim();if(!title)return;const taskId=id();enqueue('POST',taskId,{id:taskId,title,planned_date:base.today});$('quick').value='';store.set(sessionStorage,'lantern.draft','');view='today';draw(true)});
const form=$('editor');function field(n){return form.elements.namedItem(n)}function subRow(sub){const row=el('div','sub-edit');const c=el('input');c.type='checkbox';c.checked=!!sub.done;c.setAttribute('aria-label','Subtask completed');const t=el('input');t.type='text';t.maxLength=500;t.placeholder='Subtask';t.value=sub.text||'';t.setAttribute('aria-label','Subtask title');const x=el('button','','Remove');x.type='button';x.onclick=()=>row.remove();row.append(c,t,x);$('sub-edit').appendChild(row)}
function openEditor(task){previousFocus=document.activeElement;editing=task?task.id:null;const t=task||defaults('',base.today);editOriginal=task?JSON.parse(JSON.stringify(task)):null;for(const k of ['title','priority','estimate','planned_date','due_date','category','recurrence','notes'])field(k).value=t[k];if(!task)field('title').value=$('quick').value;field('rollover').checked=t.rollover;field('tags').value=t.tags.join(', ');field('links').value=t.links.join('\n');$('sub-edit').textContent='';t.subtasks.forEach(subRow);$('editor-title').textContent=task?'Edit task':'New task';$('delete').hidden=!task;$('overlay').hidden=false;field('title').focus()}
function closeEditor(){$('overlay').hidden=true;editing=null;editOriginal=null;if(previousFocus&&document.contains(previousFocus))previousFocus.focus()}
$('details').onclick=()=>openEditor(null);$('close-editor').onclick=closeEditor;$('cancel').onclick=closeEditor;$('add-sub').onclick=()=>{if($('sub-edit').children.length<100)subRow({text:'',done:false})};$('delete').onclick=()=>{if(editing&&confirm('Delete this task permanently?')){const taskId=editing;closeEditor();enqueue('DELETE',taskId)}};
form.onsubmit=e=>{e.preventDefault();const p={};for(const k of ['title','priority','planned_date','due_date','category','recurrence','notes'])p[k]=field(k).value;p.title=p.title.trim();if(!p.title)return;p.estimate=Number(field('estimate').value)||0;p.rollover=field('rollover').checked;p.tags=field('tags').value.split(',').map(x=>x.trim()).filter(Boolean);p.links=field('links').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);for(const link of p.links){try{const u=new URL(link);if(!['http:','https:'].includes(u.protocol))throw Error()}catch(e){field('links').setCustomValidity('Use http:// or https:// links.');field('links').reportValidity();return}}p.subtasks=Array.from($('sub-edit').children).map(r=>({text:r.children[1].value.trim(),done:r.children[0].checked})).filter(x=>x.text);const taskId=editing||id(),method=editing?'PATCH':'POST';if(!editing){p.id=taskId;$('quick').value='';store.set(sessionStorage,'lantern.draft','')}else{const current=editOriginal;if(current){for(const k of Object.keys(p)){if(JSON.stringify(p[k])===JSON.stringify(current[k]))delete p[k]}}}closeEditor();if(Object.keys(p).length)enqueue(method,taskId,p)};field('links').addEventListener('input',()=>field('links').setCustomValidity(''));
document.addEventListener('keydown',e=>{if($('overlay').hidden)return;if(e.key==='Escape'){e.preventDefault();closeEditor()}if(e.key==='Tab'){const nodes=Array.from($('overlay').querySelectorAll('button:not([hidden]),input,select,textarea')).filter(n=>!n.disabled&&n.offsetParent!==null);if(!nodes.length)return;if(e.shiftKey&&document.activeElement===nodes[0]){e.preventDefault();nodes[nodes.length-1].focus()}else if(!e.shiftKey&&document.activeElement===nodes[nodes.length-1]){e.preventDefault();nodes[0].focus()}}});
function theme(){const dark=document.documentElement.dataset.theme!=='light';$('theme').textContent=dark?'Light':'Dark';$('theme').setAttribute('aria-label',dark?'Switch to light mode':'Switch to dark mode')}$('theme').onclick=()=>{const t=document.documentElement.dataset.theme==='light'?'dark':'light';document.documentElement.dataset.theme=t;try{localStorage.setItem('lantern.theme',t)}catch(e){}theme()};theme();$('sync').onclick=()=>sync(true);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync(true)});window.addEventListener('focus',()=>sync(true));window.addEventListener('online',()=>sync(true));window.addEventListener('storage',e=>{if(e.key==='lantern.cache.v1'&&!busy){const s=store.get(localStorage,'lantern.cache.v1',base);if(s&&Array.isArray(s.tasks)){base=s;draw()}}});window.addEventListener('beforeunload',e=>{if(pending.length){e.preventDefault();e.returnValue=''}});setInterval(()=>{if(!document.hidden)sync(false)},10000);draw(true);sync(true);
// Tailwind loads only after initial rendering; lite mode and disconnected LANs work without it.
if(new URLSearchParams(location.search).get('lite')!=='1'){const link=$('tw');link.onload=()=>{link.media='all'};setTimeout(()=>{link.href=link.dataset.href},300)}
})();
</script>
</body></html>
